[tools]
kubectl           = "1.35.2"
yamllint          = "latest"
kubeconform       = "latest"
kubeseal          = "0.35.0"
helm              = "4.1.1"
uv                = "0.10.9"
markdownlint-cli2 = "latest"

[tasks.lint]
description = "Lint YAML files and validate Kubernetes manifests"
run = """
yamllint applications/
kubeconform -strict -ignore-missing-schemas -summary -ignore-filename-pattern 'values\\.yaml' applications/
uvx check-jsonschema --schemafile https://raw.githubusercontent.com/traefik/traefik-helm-chart/master/traefik/values.schema.json applications/vendor/traefik/values.yaml
uvx check-jsonschema --schemafile https://raw.githubusercontent.com/cert-manager/cert-manager/master/deploy/charts/cert-manager/values.schema.json applications/vendor/cert-manager/values.yaml
markdownlint-cli2 "docs/**/*.md"
"""

[tasks.docs]
description = "Serve MkDocs documentation with live reload"
run = "uvx --with mkdocs --with mkdocs-material --with mkdocs-kroki-plugin --with mkdocs-minify-plugin -- mkdocs serve --livereload"

[tasks.fetch-cert]
description = "Fetch the kubeseal certificate from the cluster"
run = """
mkdir -p certs
kubeseal --fetch-cert \
  --controller-name=sealed-secrets \
  --controller-namespace=sealed-secrets \
  > certs/cert.pem
echo "Certificate saved to certs/cert.pem"
"""

[tasks.seal-secret]
description = "Interactively seal a secret from a .env file"
run = "uv run scripts/seal_secret.py"
