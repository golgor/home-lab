---
# Project information
site_name: Home-lab
site_url: http://home-lab.local
site_author: Robert Nyström
site_description: Documentation covering my Home-lab setup based on k3s.

# Repository
repo_name: golgor/home-lab
repo_url: https://github.com/golgor/home-lab

# Configuration
theme:
  name: material
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    # - content.code.select
    # - content.footnote.tooltips
    # - content.tabs.link
    - content.tooltips
    # - header.autohide
    # - navigation.expand
    - navigation.footer
    - navigation.indexes
    # - navigation.instant
    # - navigation.instant.prefetch
    # - navigation.instant.progress
    # - navigation.prune
    - navigation.sections
    - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    # - toc.integrate
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: logo

# Plugins
plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/mkdocs.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

not_in_nav: |
  CLAUDE.md

# Page tree
nav:
  - Home: index.md
  - Get Started:
    - Prerequisites: get-started/prerequisites.md
    - Cluster Setup: get-started/cluster-setup.md
    - Bootstrap: get-started/bootstrap.md
    - DNS & Ingress: get-started/dns-ingress.md
  - Concepts:
    - GitOps: concepts/gitops.md
    - Repository Structure: concepts/repo-structure.md
    - Kustomize & Helm: concepts/kustomize-helm.md
    - Certificates & HTTPS: concepts/certificates-https.md
    - Database Connections: concepts/database-connections.md
  - Applications:
    - Overview: applications/index.md
    - ArgoCD: applications/argocd.md
    - Sealed Secrets: applications/sealed-secrets.md
    - cert-manager: applications/cert-manager.md
    - Traefik: applications/traefik.md
    - Authentik: applications/authentik.md
  - Guides:
    - Adding a Vendor App: guides/vendor.md
    - Adding a Custom App: guides/custom.md
    - Authentik Forward Auth: guides/authentik.md
    - Ansible: guides/ansible.md
    - Remote kubectl Access: guides/k3s-remote-access.md
    - Per-Network DNS: guides/per-network-dns.md
    - Pulumi:
      - Overview: guides/pulumi/overview.md
      - Stacks: guides/pulumi/stacks.md
      - Config & Secrets: guides/pulumi/config.md
      - Adding a Component: guides/pulumi/components.md
      - Database Management: guides/pulumi/database.md
  - Operations:
    - Upgrading: operations/upgrading.md
    - Backups: operations/backups.md
    - Troubleshooting: operations/troubleshooting.md
  - Reference:
    - Commands: reference/commands.md
    - Certificates: reference/certificates.md
    - Pulumi: reference/pulumi.md
