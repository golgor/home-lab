---
# Argo CD project "apps": every Application that vendor-apps and custom-apps
# create (vendor/*/application.yaml and one per applications/custom/*). The root,
# vendor-apps and custom-apps themselves stay in "default", which Argo CD always
# has: a root in a project it creates itself deadlocks if that project is ever
# missing, since it cannot sync to recreate it.
#
# Permissive on purpose: it groups apps in the UI and allows what "default"
# allows, so moving an app here cannot block its sync. Tighten later if needed.
#
# Synced by the root (bootstrap/root.yaml) in sync wave -1, before the objects in
# the same sync that reference it. Prune=false: a typo in the root's include list
# or a renamed file leaves this in place; without it, every Application in the
# project would stop syncing. Delete=false: the same if the root is ever deleted
# with cascade. Delete or rename this by hand only, and only once no Application
# uses it.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  description: "Vendor and custom apps"
  sourceRepos:
    - "*"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
