apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: traefik

resources:
  # Gateway API CRDs (GatewayClass, Gateway, HTTPRoute, etc.) — not part of Traefik chart
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml
  - dashboard-ingressroute.yaml
  - certificate.yaml
  - tlsstore.yaml

helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: "39.0.5"
    releaseName: traefik
    namespace: traefik
    includeCRDs: true
    valuesFile: values.yaml
