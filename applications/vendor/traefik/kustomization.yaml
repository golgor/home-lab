apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: traefik

resources:
  - dashboard-ingressroute.yaml
  - certificate.yaml
  - tlsstore.yaml

helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: "39.0.5"
    releaseName: traefik
    namespace: traefik
    includeCRDs: true
    valuesFile: values.yaml
