---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage

resources:
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml

configMapGenerator:
  - name: homepage
    options:
      disableNameSuffixHash: true
    files:
      - config/kubernetes.yaml
      - config/settings.yaml
      - config/services.yaml
      - config/widgets.yaml
      - config/bookmarks.yaml
      - config/docker.yaml
      - config/custom.css
      - config/custom.js
