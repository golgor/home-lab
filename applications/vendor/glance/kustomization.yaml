---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: glance

commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

resources:
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml
  - glance-k8s-deployment.yaml
  - glance-k8s-service.yaml
  - glance-secrets-sealedsecret.yaml

configMapGenerator:
  - name: glance-config
    options:
      disableNameSuffixHash: true
    files:
      - config/glance.yml
