---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance-k8s
  namespace: glance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glance-k8s
  template:
    metadata:
      labels:
        app: glance-k8s
    spec:
      serviceAccountName: glance-k8s
      containers:
        - name: glance-k8s
          image: ghcr.io/lukasdietrich/glance-k8s/glance-k8s:v0.4.7
          ports:
            - containerPort: 8080
