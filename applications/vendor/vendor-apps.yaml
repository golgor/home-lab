---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vendor-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/golgor/home-lab.git
    targetRevision: HEAD
    path: applications/vendor
    directory:
      recurse: true
      include: "**/application.yaml"
      # Authentik disabled: access is gated by Tailscale, not forward-auth.
      # Re-enable by removing this exclude (e.g. before exposing a service publicly via Cloudflare Tunnel).
      exclude: "authentik/**"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
