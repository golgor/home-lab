---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homarr

commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

resources:
  - ingressroute.yaml
  - homarr-db-secret-sealedsecret.yaml
  - homarr-db-encryption-sealedsecret.yaml

helmCharts:
  - name: homarr
    repo: https://homarr-labs.github.io/charts/
    releaseName: homarr
    namespace: homarr
    valuesFile: values.yaml
    version: 8.14.0
