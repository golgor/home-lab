---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cert-manager

resources:
  - clusterissuer.yaml
  - cloudflare-api-token-sealedsecret.yaml

helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: "1.20.0"
    releaseName: cert-manager
    namespace: cert-manager
    valuesFile: values.yaml
