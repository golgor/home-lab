---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: custom-apps
  namespace: argocd
  annotations:
    # Synced by the root app-of-apps (applications/bootstrap/root.yaml). Prune=false: a
    # typo in the root's include list or a renamed file leaves this in place
    # instead of deleting it and every Application it generates. Delete=false:
    # the same if the root is ever deleted with cascade. Delete or rename by hand.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/golgor/home-lab.git
        revision: HEAD
        directories:
          - path: applications/custom/*
  template:
    metadata:
      name: "{{ .path.basename }}"
    spec:
      project: apps
      source:
        repoURL: https://github.com/golgor/home-lab.git
        targetRevision: HEAD
        path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .path.basename }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      revisionHistoryLimit: 2
